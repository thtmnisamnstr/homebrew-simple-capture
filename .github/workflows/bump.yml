name: bump

on:
  schedule:
    - cron: "23 * * * *"
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: bump
  cancel-in-progress: false

defaults:
  run:
    shell: bash -euo pipefail {0}

env:
  UPSTREAM: thtmnisamnstr/simple-capture
  CASK: thtmnisamnstr/simple-capture/simple-capture
  CASK_FILE: Casks/simple-capture.rb

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      bump: ${{ steps.latest.outputs.bump }}
      version: ${{ steps.latest.outputs.version }}
      sha256: ${{ steps.latest.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare the cask with the latest published release
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' "$CASK_FILE")
          current_sha=$(sed -n 's/^  sha256 "\(.*\)"$/\1/p' "$CASK_FILE")
          if ! rel=$(gh api "repos/$UPSTREAM/releases/latest" 2>"$RUNNER_TEMP/err"); then
            if grep -q 'HTTP 404' "$RUNNER_TEMP/err"; then
              echo "No published release yet."
              echo "bump=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            cat "$RUNNER_TEMP/err" >&2
            exit 1
          fi
          tag=$(jq -r .tag_name <<<"$rel")
          version=${tag#v}
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag $tag"
            exit 1
          fi
          name="Simple.Capture_${version}_aarch64.dmg"
          digest=$(jq -r --arg n "$name" '.assets[] | select(.name == $n) | (.digest // "none")' <<<"$rel")
          if [ -z "$digest" ]; then
            echo "::error::Release $tag has no asset named $name"
            exit 1
          fi
          sha256=${digest#sha256:}
          if [ "$version" = "$current" ]; then
            if [ "$sha256" != none ] && [ "$sha256" != "$current_sha" ]; then
              echo "::error::$name changed after release (GitHub digest $sha256, cask $current_sha)"
              exit 1
            fi
            echo "Cask is at the latest release ($current)."
            echo "bump=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$(printf '%s\n%s\n' "$current" "$version" | sort -V | tail -n1)" != "$version" ]; then
            echo "::error::Latest release $version is older than the cask ($current)"
            exit 1
          fi
          {
            echo "bump=true"
            echo "version=$version"
            echo "sha256=$sha256"
          } >>"$GITHUB_OUTPUT"

  bump:
    needs: check
    if: needs.check.outputs.bump == 'true' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      API_SHA256: ${{ needs.check.outputs.sha256 }}
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - name: Set up Homebrew
        uses: Homebrew/actions/setup-homebrew@61b401267256bb9c047d6d1481b176d5772a0ba7 # 2026.11.23.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download the DMG and check its checksum
        run: |
          url="https://github.com/$UPSTREAM/releases/download/v$VERSION/Simple.Capture_${VERSION}_aarch64.dmg"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/sc.dmg" "$url"
          sha256=$(shasum -a 256 "$RUNNER_TEMP/sc.dmg" | cut -d' ' -f1)
          if [ "$API_SHA256" != none ] && [ "$sha256" != "$API_SHA256" ]; then
            echo "::error::Downloaded SHA-256 $sha256 differs from GitHub's digest $API_SHA256"
            exit 1
          fi
          echo "SHA256=$sha256" >>"$GITHUB_ENV"

      - name: Update the cask
        run: |
          sed -i '' -E \
            -e "s/^  version \"[^\"]+\"$/  version \"$VERSION\"/" \
            -e "s/^  sha256 \"[0-9a-f]{64}\"$/  sha256 \"$SHA256\"/" \
            "$CASK_FILE"
          grep -qxF "  version \"$VERSION\"" "$CASK_FILE"
          grep -qxF "  sha256 \"$SHA256\"" "$CASK_FILE"
          git diff

      - name: Style and online audit
        run: |
          brew style "$CASK_FILE"
          brew audit --cask --strict --online "$CASK"

      - name: Install, check Gatekeeper, uninstall
        run: |
          brew install --cask "$CASK"
          app="/Applications/Simple Capture.app"
          codesign --verify --deep --strict "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute -vv "$app" 2>&1 | tee "$RUNNER_TEMP/spctl.txt"
          grep -q 'source=Notarized Developer ID' "$RUNNER_TEMP/spctl.txt"
          brew uninstall --cask --zap "$CASK"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$CASK_FILE"
          git commit -m "simple-capture $VERSION"
          git push origin HEAD:main

  keepalive:
    if: github.event_name == 'schedule' && github.event.schedule == '41 5 * * 1'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Keep the schedule from being auto-disabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/bump.yml/enable"
